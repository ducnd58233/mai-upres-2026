[project]
name = "mai-upres-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
build = [
    "ai-edge-litert>=2.1.2",
    "onnx>=1.14.0,<1.20.0",
    "onnx-graphsurgeon>=0.5.8",
    "onnx2tf>=1.28.8",
    "onnxscript>=0.6.2",
    "psutil>=7.2.2",
    "sng4onnx>=2.0.0",
    "tensorflow>=2.20.0",
    "tf-keras>=2.20.1",
]
datasets = [
    "kaggle>=1.8.4",
]
dev = [
    "pre-commit>=4.5.1",
]

[tool.isort]
profile = "black"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
